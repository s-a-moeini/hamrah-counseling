
media:
  - name: consultants
    label: تصاویر مشاوران
    input: public/images/consultants
    output: /images/consultants
    extensions:
      - jpg
      - jpeg
      - png
      - webp

  - name: courses
    label: تصاویر دوره‌ها
    input: public/images/courses
    output: /images/courses
    extensions:
      - jpg
      - jpeg
      - png
      - webp

content:
  - name: consultants
    label: مشاوران
    type: collection
    path: src/content/consultants
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: name
      sort: sortOrder
      order: asc
    fields:
      - name: name
        label: نام و نام خانوادگی
        type: string

      - name: image
        label: تصویر مشاور
        type: image
        options:
          media: consultants

      - name: title
        label: عنوان تخصصی
        type: string

      - name: degree
        label: مدرک تحصیلی
        type: string

      - name: specialties
        label: حوزه‌های تخصص
        type: text

      - name: bio
        label: معرفی کوتاه
        type: text

      - name: experience
        label: سوابق و توضیحات کامل
        type: text

      - name: sortOrder
        label: ترتیب نمایش
        type: number



  - name: courses
    label: دوره‌ها
    type: collection
    path: src/content/courses
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: name
      sort: sortOrder
      order: asc
    fields:
      - name: name
        label: نام دوره
        type: string
      - name: image
        label: تصویر دوره
        type: image
        options:
          media: courses
      - name: instructor
        label: نام مدرس
        type: string
      - name: instructorBio
        label: توضیحات مدرس
        type: text
      - name: topics
        label: سرفصل‌ها
        type: text
      - name: location
        label: مکان برگزاری
        type: string
      - name: schedule
        label: تاریخ برگزاری
        type: text
      - name: duration
        label: مدت برگزاری
        type: string
      - name: description
        label: توضیحات دوره
        type: text
      - name: cost
        label: هزینه
        type: string
      - name: registration
        label: نحوه ثبت‌نام
        type: text
      - name: sortOrder
        label: ترتیب نمایش
        type: number
